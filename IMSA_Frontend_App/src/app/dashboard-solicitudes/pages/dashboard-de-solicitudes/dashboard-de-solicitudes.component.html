<div class="container offset-lg-2 offset-xl-2">
<div class="row">
          <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
  <!-- Position Column -->
  <ng-container matColumnDef="Folio">
    <th mat-header-cell *matHeaderCellDef>No. Folio</th>
    <td mat-cell *matCellDef="let element">{{element.numeroFolio}}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="Numero Solicitud">
    <th mat-header-cell *matHeaderCellDef>Numero Solicitud</th>
    <td mat-cell *matCellDef="let element">{{element.numeroScSolicitud}}</td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="Fecha Solicitud">
    <th mat-header-cell *matHeaderCellDef>Fecha Solicitud</th>
    <td mat-cell *matCellDef="let element">{{element.fechaSolicitud}}</td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="Nombre Solicitante">
    <th mat-header-cell *matHeaderCellDef>Nombre Solicitante</th>
    <td mat-cell *matCellDef="let element">{{element.nombreSolicitante}}</td>
  </ng-container>

    <ng-container matColumnDef="Encargado Adquisicion">
    <th mat-header-cell *matHeaderCellDef>Encargado Adquisicion</th>
    <td mat-cell *matCellDef="let element">{{element.encargadoAdquisicion}}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
      mat-row
     (click)="onRowClicked(row)"
      [class.demo-row-is-clicked]="clickedRows.has(row)"
      *matRowDef="let row; columns: displayedColumns;"
        (dblclick)="onRowDoubleClicked(row)"
  ></tr>
</table>
      </div>
</div>
